name: CVT Phoenix

on:
  pull_request:
    branches: [cvt]
  push:
    branches: [cvt]
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish a candidate image from the selected revision
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cvt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: CVT Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          resolution-strategy: lowest
      - name: Sync locked development dependencies
        run: uv sync --frozen
      - name: Check Python formatting
        run: uv run --frozen ruff format --check .
      - name: Lint Python
        run: uv run --frozen ruff check .
      - name: Type check Python
        run: uv run --frozen mypy
      - name: Install upstream unit-test environment
        # Equivalent to tox unit_tests. Keep pydantic-ai-slim at its uv.lock
        # version: tests compare the vendored request types with that package.
        run: |
          uv venv .venv-unit --python 3.11
          uv pip install --python .venv-unit/bin/python --strict -r requirements/unit-tests.txt pydantic-ai-slim==2.55.0
          uv pip install --python .venv-unit/bin/python --strict ./packages/phoenix-evals
          uv pip install --python .venv-unit/bin/python --strict --no-sources .
          uv pip install --python .venv-unit/bin/python --strict --no-sources ./evals/harbor/verifiers
      - name: Run upstream unit tests
        working-directory: tests
        env:
          PHOENIX_MASK_INTERNAL_SERVER_ERRORS: "false"
          PYTHONUNBUFFERED: "1"
        run: ../.venv-unit/bin/pytest unit/ -n 4 --dist loadscope -ra

  image:
    name: CVT image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Set image tag
        id: image
        env:
          REVISION: ${{ github.sha }}
          TAG_PREFIX: ${{ github.event_name == 'workflow_dispatch' && '20.23.0-cvt.candidate' || '20.23.0-cvt' }}
        run: echo "tag=ghcr.io/cambridge-vision-technology/phoenix:${TAG_PREFIX}.${REVISION:0:12}" >> "$GITHUB_OUTPUT"
      - name: Build patched nonroot image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/Cambridge-Vision-Technology/phoenix
          build-args: |
            BASE_IMAGE=gcr.io/distroless/python3-debian13:nonroot@sha256:f47f5807043391605425f2bd162b25f50cebdc90640bacc804e0177608fe5c65
            UV_IMAGE=ghcr.io/astral-sh/uv:0.12.19-python3.13-trixie-slim@sha256:aba5f865793af9275ceaa06d30935dfc6db8b81969c9fb099b0ebca6396b189e
          build-contexts: |
            node:24-slim=docker-image://docker.io/library/node:24-slim@sha256:a5f4366e834695d5f363b920c104953a535d3a9864d1bdf74566a0ebe01daee5
            denoland/deno:bin-2.1.4=docker-image://docker.io/denoland/deno:bin-2.1.4@sha256:1cc7ab514b88a615cde5acf4a6db0baa7dd27fdc9476cf3f4e0671f4cfce29aa
          cache-from: type=gha,scope=cvt-amd64
          cache-to: type=gha,scope=cvt-amd64,mode=max
      - name: Require healthy container
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          docker run --detach --name phoenix --publish 127.0.0.1:6006:6006 "$IMAGE"
          curl --fail --show-error --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors --max-time 5 http://127.0.0.1:6006/healthz
      - name: Show container logs
        if: always()
        run: docker logs phoenix
      - name: Log in to GHCR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/cvt') || (github.event_name == 'workflow_dispatch' && inputs.publish_candidate)
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/cvt') || (github.event_name == 'workflow_dispatch' && inputs.publish_candidate)
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker push "$IMAGE"
      - name: Remove test container
        if: always()
        run: docker rm --force phoenix
